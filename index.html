<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프롬프트 상자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5;
    --text: #18181b; --text-2: #52525b; --muted: #a1a1aa;
    --line: #e4e4e7; --line-strong: #d4d4d8;
    --ink: #18181b; --ink-text: #ffffff;
    --accent: #6366f1; --accent-soft: #eef2ff;
    --star: #f59e0b; --ok: #16a34a; --danger: #dc2626;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.04);
    --shadow-hover: 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10; --surface: #18181b; --surface-2: #232327;
      --text: #f4f4f5; --text-2: #b4b4bb; --muted: #71717a;
      --line: #2a2a2f; --line-strong: #3a3a40;
      --ink: #f4f4f5; --ink-text: #18181b;
      --accent: #818cf8; --accent-soft: #23243a;
      --shadow: none; --shadow-hover: 0 4px 16px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; }
  input, textarea { font: inherit; color: var(--text); }

  /* 상단 */
  .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1040px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 12px; align-items: center; }
  .logo { font-weight: 700; font-size: 17px; white-space: nowrap; }
  .search { flex: 1; position: relative; }
  .search input { width: 100%; height: 40px; padding: 0 14px 0 38px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, box-shadow .15s; }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px;
    color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

  .btn { height: 40px; padding: 0 14px; border-radius: 10px; font-weight: 500; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s, opacity .15s; }
  .btn-ink { background: var(--ink); color: var(--ink-text); }
  .btn-ink:hover { opacity: .88; }
  .btn-line { border: 1px solid var(--line); background: var(--surface); }
  .btn-line:hover { background: var(--surface-2); }
  .btn-text { color: var(--text-2); padding: 0 10px; }
  .btn-text:hover { color: var(--text); background: var(--surface-2); }

  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: 46px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow-hover); padding: 4px; min-width: 150px; display: none; }
  .menu-pop.show { display: block; }
  .menu-pop button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .menu-pop button:hover { background: var(--surface-2); }

  /* 본문 */
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 20px 80px; }
  .tags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
  .tags::-webkit-scrollbar { display: none; }
  .chip { font-size: 13.5px; padding: 6px 12px; border-radius: 999px; color: var(--text-2);
    border: 1px solid var(--line); background: var(--surface); white-space: nowrap; transition: .15s; }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip.on { background: var(--ink); color: var(--ink-text); border-color: var(--ink); }
  .chip .n { opacity: .5; margin-left: 4px; font-size: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; transition: box-shadow .15s, border-color .15s; }
  .card:hover { box-shadow: var(--shadow-hover); border-color: var(--line-strong); }
  .card-head { display: flex; align-items: flex-start; gap: 6px; padding: 14px 14px 0 16px; }
  .card-title { font-weight: 600; font-size: 15.5px; flex: 1; line-height: 1.4; padding-top: 4px; overflow-wrap: anywhere; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.fav { color: var(--star); }

  .body { margin: 10px 16px 0; padding: 12px; background: var(--surface-2); border-radius: 10px;
    font-size: 13.5px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .body.open { display: block; }
  .var { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 4px; font-weight: 500; }

  .info { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); }
  .row { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
  .row svg { flex-shrink: 0; margin-top: 2px; color: var(--muted); }
  .row a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row a:hover { text-decoration: underline; }
  .row span { overflow-wrap: anywhere; }

  .card-foot { margin-top: auto; padding: 12px 14px 14px 16px; display: flex; align-items: center; gap: 8px; }
  .card-tags { flex: 1; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--text-2); background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
  .copy { height: 34px; padding: 0 14px; border-radius: 9px; background: var(--ink); color: var(--ink-text);
    font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; transition: .15s; }
  .copy:hover { opacity: .88; }
  .copy.done { background: var(--ok); color: #fff; }

  .empty { text-align: center; color: var(--text-2); padding: 80px 20px; }
  .empty b { display: block; font-size: 17px; color: var(--text); margin-bottom: 6px; }

  /* 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(9,9,11,.45); display: none; z-index: 10;
    align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
  .modal-bg.show { display: flex; animation: fade .15s; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2); animation: up .18s; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes up { from { transform: translateY(8px); opacity: 0 } }
  .modal-head { padding: 18px 20px 4px; font-weight: 700; font-size: 17px; }
  .modal-body { padding: 8px 20px 4px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); transition: border-color .15s, box-shadow .15s; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field textarea { resize: vertical; min-height: 150px; line-height: 1.6; }
  .field .memo-ta { min-height: 72px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .hint code { background: var(--accent-soft); color: var(--accent); padding: 0 4px; border-radius: 4px; font-family: inherit; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-foot { padding: 18px 20px; display: flex; gap: 8px; align-items: center; }
  .modal-foot .spacer { flex: 1; }
  .btn-danger { color: var(--danger); padding: 0 10px; }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .preview { margin-top: 16px; padding: 12px; background: var(--surface-2); border-radius: 10px;
    font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; max-height: 220px; overflow-y: auto; color: var(--text-2); overflow-wrap: anywhere; }
  .preview-label { font-size: 12px; color: var(--muted); margin-top: 16px; }

  .sync { font-size: 12.5px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
  .sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .sync.ok::before { background: var(--ok); }
  .sync.busy::before { background: var(--star); }
  .sync.err { color: var(--danger); }
  .sync.err::before { background: var(--danger); }
  .sync:hover { border-color: var(--line-strong); }
  .link-box { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2);
    display: flex; gap: 12px; align-items: center; font-size: 14px; }
  .link-box > div { flex: 1; }
  .link-box .hint { margin-top: 2px; }
  .steps { font-size: 13.5px; color: var(--text-2); line-height: 1.7; margin: 4px 0 0; padding-left: 18px; }
  .steps a { color: var(--accent); }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 12px); background: var(--ink);
    color: var(--ink-text); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0;
    transition: .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .top-inner { flex-wrap: wrap; padding: 12px 16px; }
    .logo { flex: 1; }
    .search { order: 3; flex-basis: 100%; }
    .kbd { display: none; }
    .wrap { padding: 16px 16px 80px; }
    .grid { grid-template-columns: 1fr; }
    .two { grid-template-columns: 1fr; gap: 0; }
    .btn-new-label { display: none; }
    .sync-label { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="top-inner">
    <div class="logo">📦 프롬프트 상자</div>
    <button class="sync" id="sync" title="저장 위치 설정"><span class="sync-label" id="syncLabel"></span></button>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="제목, 내용, 출처, 메모로 검색">
      <span class="kbd">/</span>
    </div>
    <div class="menu">
      <button class="btn btn-text" id="menuBtn" title="백업">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="menu-pop" id="menuPop">
        <button id="connectBtn">구글 시트 연결</button>
        <button id="exportBtn">백업 파일 저장</button>
        <button id="importBtn">백업 불러오기</button>
      </div>
    </div>
    <button class="btn btn-ink" id="newBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-new-label">새 프롬프트</span>
    </button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</div>

<div class="wrap">
  <div class="tags" id="tags"></div>
  <div id="list"></div>
</div>

<!-- 작성/수정 -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <div class="modal-head" id="editTitle">새 프롬프트</div>
    <div class="modal-body">
      <div class="field"><label>제목</label><input id="fTitle" placeholder="예: 블로그 글 다듬기"></div>
      <div class="field">
        <label>프롬프트</label>
        <textarea id="fBody" placeholder="{{주제}}에 대해 블로그 글을 써줘. 말투는 {{말투}}로."></textarea>
        <div class="hint"><code>{{빈칸}}</code> 처럼 쓰면 복사할 때 채워 넣을 수 있어요</div>
      </div>
      <div class="two">
        <div class="field"><label>출처</label><input id="fSource" placeholder="링크 또는 메모"></div>
        <div class="field"><label>태그</label><input id="fTags" placeholder="블로그, 마케팅"></div>
      </div>
      <div class="field"><label>메모</label><textarea id="fMemo" class="memo-ta" placeholder="써보니 어땠는지, 팁 등"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="deleteBtn">삭제</button>
      <div class="spacer"></div>
      <button class="btn btn-line" id="cancelBtn">취소</button>
      <button class="btn btn-ink" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 빈칸 채우기 -->
<div class="modal-bg" id="fillModal">
  <div class="modal">
    <div class="modal-head">빈칸 채우기</div>
    <div class="modal-body">
      <div id="fillFields"></div>
      <div class="preview-label">미리보기</div>
      <div class="preview" id="fillPreview"></div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn btn-line" id="fillCancel">취소</button>
      <button class="btn btn-ink" id="fillCopy">복사하기</button>
    </div>
  </div>
</div>

<!-- 구글 시트 연결 -->
<div class="modal-bg" id="connModal">
  <div class="modal">
    <div class="modal-head">구글 시트 연결</div>
    <div class="modal-body">
      <ol class="steps">
        <li>구글 시트에 Apps Script를 붙여서 웹 앱으로 배포해요 (<a href="https://github.com/stella-L/prompt-box#구글-시트-연결" target="_blank" rel="noopener">설정 방법</a>)</li>
        <li>배포 URL과 스크립트에 넣은 토큰을 아래에 입력해요</li>
      </ol>
      <div class="field"><label>웹 앱 URL</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label>토큰</label><input id="cToken" type="password" placeholder="Code.gs의 TOKEN 값"></div>
      <div class="hint">URL과 토큰은 이 브라우저에만 저장돼요. 다른 기기에서도 같은 값을 한 번 입력하면 돼요.</div>
      <div class="link-box" id="linkBox">
        <div>
          <b>연결 링크</b>
          <div class="hint">새 기기·브라우저에서 이 링크를 열면 바로 연결돼요. 토큰이 들어 있으니 나만 보관하세요.</div>
        </div>
        <button class="btn btn-line" id="copyLinkBtn">링크 복사</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="disconnectBtn">연결 해제</button>
      <div class="spacer"></div>
      <button class="btn btn-line" id="connCancel">취소</button>
      <button class="btn btn-ink" id="connSave">연결</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'prompt-box-v1';
const REMOTE_KEY = 'prompt-box-remote';
const $ = id => document.getElementById(id);
const VAR_RE = /\{\{\s*([^{}]+?)\s*\}\}/g;

const ICON = {
  star: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starOn: '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>',
  link: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  memo: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>',
};

const SAMPLES = [
  { title: '블로그 글 초안', body: '{{주제}}에 대해 네이버 블로그 글을 써줘.\n- 독자: {{독자}}\n- 말투: 친근한 존댓말\n- 소제목 3~4개로 나누고, 마지막에 한 줄 요약', source: '직접 작성', tags: ['블로그'], memo: '독자를 구체적으로 적을수록 결과가 좋아요', fav: true },
  { title: '숏츠 대본 30초', body: '"{{주제}}"로 30초 유튜브 숏츠 대본을 써줘.\n첫 3초 훅 → 핵심 3가지 → 마무리 한 줄 순서로, 자막용으로 짧게 끊어서.', source: 'https://www.youtube.com', tags: ['숏츠', '마케팅'], memo: '' },
  { title: '문장 다듬기', body: '아래 글을 의미는 그대로 두고 더 자연스럽게 다듬어줘. 바꾼 부분은 굵게 표시해줘.\n\n', source: '', tags: ['글쓰기'], memo: 'Claude에서 잘 됨' },
];

let prompts = load();
let activeTag = null;
let editingId = null;
let fillTarget = null;
let remote = loadRemote();
let pending = 0;   // 시트로 보내는 중인 요청 수
let version = 0;   // 로컬 변경 횟수 — 불러오는 사이 바뀌면 결과를 버린다

function uid() { return crypto.randomUUID?.() ?? String(Date.now() + Math.random()); }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  const now = Date.now();
  return SAMPLES.map((s, i) => ({ id: uid(), fav: false, created: now - i, updated: now - i, ...s }));
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(prompts)); } catch {}
}
function loadRemote() {
  try { return JSON.parse(localStorage.getItem(REMOTE_KEY)); } catch { return null; }
}

// 구글 시트
function setSync(state, label) {
  $('sync').className = 'sync ' + state;
  $('syncLabel').textContent = label;
}
function idleSync() { remote ? setSync('ok', '구글 시트') : setSync('', '이 브라우저'); }

async function api(action, data = {}, conn = remote) {
  const res = await fetch(conn.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight 없이 Apps Script로 보내기
    body: JSON.stringify({ token: conn.token, action, ...data }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '요청 실패');
  return json;
}

async function push(action, data) {
  if (!remote) return;
  pending++; setSync('busy', '저장 중…');
  try {
    await api(action, data);
    if (--pending === 0) idleSync();
  } catch {
    pending--;
    setSync('err', '저장 실패');
    toast('시트에 저장하지 못했어요');
  }
}

async function pull() {
  if (!remote || pending) return;
  const v = version;
  try {
    const { items } = await api('list');
    if (v !== version || pending) return;
    prompts = items; saveLocal(); render(); idleSync();
  } catch {
    setSync('err', '연결 오류');
  }
}

// 바꾼 내용을 로컬에 저장하고 시트로 보낸다
function commit(action, data) {
  version++; saveLocal(); render(); push(action, data);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function varsOf(text) { return [...new Set([...text.matchAll(VAR_RE)].map(m => m[1]))]; }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const counts = {};
  prompts.forEach(p => p.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
  const allTags = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ko'));
  if (activeTag && !counts[activeTag]) activeTag = null;
  const favCount = prompts.filter(p => p.fav).length;

  $('tags').innerHTML = prompts.length
    ? `<button class="chip ${activeTag ? '' : 'on'}" data-tag="">전체<span class="n">${prompts.length}</span></button>` +
      (favCount ? `<button class="chip ${activeTag === '★' ? 'on' : ''}" data-tag="★">★ 즐겨찾기<span class="n">${favCount}</span></button>` : '') +
      allTags.map(t => `<button class="chip ${t === activeTag ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)}<span class="n">${counts[t]}</span></button>`).join('')
    : '';

  const items = prompts
    .filter(p => !activeTag || (activeTag === '★' ? p.fav : p.tags.includes(activeTag)))
    .filter(p => !q || [p.title, p.body, p.source, p.memo, p.tags.join(' ')].join('\n').toLowerCase().includes(q))
    .sort((a, b) => (b.fav - a.fav) || (b.updated - a.updated));

  if (!prompts.length) {
    $('list').innerHTML = `<div class="empty"><b>아직 저장된 프롬프트가 없어요</b>오른쪽 위 <b style="display:inline">+</b> 버튼으로 첫 프롬프트를 추가해 보세요</div>`;
    return;
  }
  if (!items.length) {
    $('list').innerHTML = `<div class="empty"><b>검색 결과가 없어요</b>다른 단어로 찾아보세요</div>`;
    return;
  }

  $('list').innerHTML = '<div class="grid">' + items.map(p => {
    const body = esc(p.body.trim()).replace(/\{\{\s*([^{}]+?)\s*\}\}/g, '<span class="var">$1</span>');
    let src = '';
    if (p.source) {
      src = /^https?:\/\//.test(p.source)
        ? `<div class="row">${ICON.link}<a href="${esc(p.source)}" target="_blank" rel="noopener">${esc(p.source.replace(/^https?:\/\/(www\.)?/, ''))}</a></div>`
        : `<div class="row">${ICON.link}<span>${esc(p.source)}</span></div>`;
    }
    const memo = p.memo ? `<div class="row">${ICON.memo}<span>${esc(p.memo)}</span></div>` : '';
    return `<div class="card" data-id="${p.id}">
      <div class="card-head">
        <div class="card-title">${esc(p.title) || '제목 없음'}</div>
        <button class="icon-btn ${p.fav ? 'fav' : ''}" data-act="fav" title="즐겨찾기">${p.fav ? ICON.starOn : ICON.star}</button>
        <button class="icon-btn" data-act="edit" title="수정">${ICON.edit}</button>
      </div>
      <div class="body" data-act="toggle" title="눌러서 전체 보기">${body}</div>
      ${src || memo ? `<div class="info">${src}${memo}</div>` : ''}
      <div class="card-foot">
        <div class="card-tags">${p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
        <button class="copy" data-act="copy">${ICON.copy}<span>복사</span></button>
      </div>
    </div>`;
  }).join('') + '</div>';
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  if (btn) {
    btn.classList.add('done'); btn.innerHTML = `${ICON.check}<span>복사됨</span>`;
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = `${ICON.copy}<span>복사</span>`; }, 1400);
  } else toast('복사했어요');
}

// 작성/수정
function openEdit(p) {
  editingId = p?.id ?? null;
  $('editTitle').textContent = p ? '프롬프트 수정' : '새 프롬프트';
  $('fTitle').value = p?.title ?? '';
  $('fBody').value = p?.body ?? '';
  $('fSource').value = p?.source ?? '';
  $('fTags').value = p ? p.tags.join(', ') : (activeTag && activeTag !== '★' ? activeTag : '');
  $('fMemo').value = p?.memo ?? '';
  $('deleteBtn').style.visibility = p ? 'visible' : 'hidden';
  $('editModal').classList.add('show');
  (p ? $('fBody') : $('fTitle')).focus();
}
function closeEdit() { $('editModal').classList.remove('show'); }

$('saveBtn').onclick = () => {
  const data = {
    title: $('fTitle').value.trim(),
    body: $('fBody').value,
    source: $('fSource').value.trim(),
    tags: [...new Set($('fTags').value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean))],
    memo: $('fMemo').value.trim(),
    updated: Date.now(),
  };
  if (!data.body.trim()) { toast('프롬프트 내용을 입력해 주세요'); $('fBody').focus(); return; }
  let item = editingId && prompts.find(p => p.id === editingId);
  if (item) Object.assign(item, data);
  else prompts.push(item = { id: editingId || uid(), fav: false, created: Date.now(), ...data });
  closeEdit(); commit('save', { item }); toast('저장했어요');
};
$('deleteBtn').onclick = () => {
  if (!confirm('이 프롬프트를 삭제할까요?')) return;
  prompts = prompts.filter(p => p.id !== editingId);
  closeEdit(); commit('delete', { id: editingId }); toast('삭제했어요');
};
$('cancelBtn').onclick = closeEdit;
$('newBtn').onclick = () => openEdit(null);

// 빈칸 채우기
function fillResult() {
  const vals = {};
  $('fillFields').querySelectorAll('input').forEach(i => vals[i.dataset.name] = i.value);
  return fillTarget.body.replace(VAR_RE, (m, name) => vals[name] || m);
}
function openFill(p, vars) {
  fillTarget = p;
  $('fillFields').innerHTML = vars.map(v =>
    `<div class="field"><label>${esc(v)}</label><input data-name="${esc(v)}" placeholder="${esc(v)} 입력"></div>`).join('');
  $('fillFields').querySelectorAll('input').forEach(i => i.oninput = () => $('fillPreview').textContent = fillResult());
  $('fillPreview').textContent = fillResult();
  $('fillModal').classList.add('show');
  $('fillFields').querySelector('input')?.focus();
}
function closeFill() { $('fillModal').classList.remove('show'); }
$('fillCopy').onclick = () => { copyText(fillResult()); closeFill(); };
$('fillCancel').onclick = closeFill;
$('fillFields').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) $('fillCopy').click();
});

// 카드 동작
$('list').onclick = e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const p = prompts.find(x => x.id === el.closest('.card').dataset.id);
  const act = el.dataset.act;
  if (act === 'copy') {
    const vars = varsOf(p.body);
    vars.length ? openFill(p, vars) : copyText(p.body, el);
  } else if (act === 'edit') openEdit(p);
  else if (act === 'fav') { p.fav = !p.fav; p.updated = Date.now(); commit('save', { item: p }); }
  else if (act === 'toggle') el.classList.toggle('open');
};
$('tags').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  activeTag = c.dataset.tag || null; render();
};
$('search').oninput = render;

// 메뉴
$('menuBtn').onclick = e => { e.stopPropagation(); $('menuPop').classList.toggle('show'); };
document.addEventListener('click', () => $('menuPop').classList.remove('show'));

// 모달 바깥 클릭 / 단축키
document.querySelectorAll('.modal-bg').forEach(bg =>
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg.classList.remove('show'); }));
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { closeEdit(); closeFill(); closeConn(); if (typing) document.activeElement.blur(); }
  if (e.key === '/' && !typing) { e.preventDefault(); $('search').focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && $('editModal').classList.contains('show')) $('saveBtn').click();
});

// 백업 / 불러오기
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(prompts, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `prompt-box-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw 0;
    const ids = new Set(prompts.map(p => p.id));
    const added = data.filter(p => p && p.id && p.body && !ids.has(p.id))
      .map(p => ({ fav: false, tags: [], source: '', memo: '', title: '', updated: Date.now(), ...p }));
    prompts.push(...added); commit('bulk', { items: added });
    toast(`${added.length}개 불러왔어요`);
  } catch { toast('파일을 읽을 수 없어요'); }
  e.target.value = '';
};

// 구글 시트 연결 설정
function openConn() {
  $('cUrl').value = remote?.url ?? '';
  $('cToken').value = remote?.token ?? '';
  $('disconnectBtn').style.visibility = remote ? 'visible' : 'hidden';
  $('linkBox').style.display = remote ? 'flex' : 'none';
  $('connModal').classList.add('show');
  $('cUrl').focus();
}
function closeConn() { $('connModal').classList.remove('show'); }
$('sync').onclick = openConn;
$('connectBtn').onclick = openConn;
$('connCancel').onclick = closeConn;
async function connect(conn) {
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(conn.url)) { toast('URL은 /exec로 끝나는 웹 앱 주소여야 해요'); return; }
  const btn = $('connSave'); btn.disabled = true; btn.textContent = '확인 중…';
  setSync('busy', '연결 중…');
  try {
    const { items } = await api('list', {}, conn);
    if (!items.length && prompts.length &&
        confirm(`시트가 비어 있어요. 이 브라우저에 있는 ${prompts.length}개를 시트로 올릴까요?`)) {
      await api('bulk', { items: prompts }, conn);
    } else {
      prompts = items;
    }
    remote = conn;
    try { localStorage.setItem(REMOTE_KEY, JSON.stringify(conn)); } catch {}
    version++; saveLocal(); render(); idleSync(); closeConn();
    toast('구글 시트에 연결했어요');
  } catch (e) {
    idleSync();
    toast(e.message === '토큰이 맞지 않아요' ? e.message : '연결하지 못했어요. URL과 배포 설정을 확인해 주세요');
  } finally {
    btn.disabled = false; btn.textContent = '연결';
  }
}
$('connSave').onclick = () => connect({ url: $('cUrl').value.trim(), token: $('cToken').value.trim() });

// 연결 링크: 주소 뒤 #connect=... 에 URL·토큰을 담는다 (# 뒤는 서버로 전송되지 않음)
$('copyLinkBtn').onclick = () => {
  const code = btoa(JSON.stringify(remote));
  copyText(location.origin + location.pathname + '#connect=' + encodeURIComponent(code));
};
function connectFromLink() {
  const m = location.hash.match(/^#connect=(.+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search); // 주소창에서 토큰 지우기
  let conn;
  try { conn = JSON.parse(atob(decodeURIComponent(m[1]))); } catch { toast('연결 링크가 올바르지 않아요'); return false; }
  connect(conn);
  return true;
}
$('disconnectBtn').onclick = () => {
  if (!confirm('연결을 해제할까요? 시트의 데이터는 그대로 남아요.')) return;
  remote = null; localStorage.removeItem(REMOTE_KEY);
  idleSync(); closeConn(); toast('연결을 해제했어요');
};

// 다른 기기에서 바꾼 내용 반영: 탭으로 돌아올 때 + 1분마다
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
setInterval(() => { if (!document.hidden) pull(); }, 60000);

render();
idleSync();
if (!connectFromLink()) pull();
</script>
</body>
</html>
